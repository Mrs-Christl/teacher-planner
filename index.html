<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="fontLink" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --hfont:'Caveat',cursive; --bfont:'Nunito',system-ui,sans-serif; --fs:16px;
  --c-topic:#2b3f63; --c-check:#b03a2e; --c-set:#2f7a4a; --c-res:#7b4fa0;
  --radius:10px; --topH:58px;
}
/* Theme colours are set from the app (see applyTheme) */
:root{--paper:#fbf6ea;--paper2:#f4eedf;--page:#efe5d2;--ink:#2d2a26;--muted:#7b7266;--line:#e2d7c5;--accent:#b5523b;--accentInk:#fff;--top:#fbf6ea;--topInk:#2d2a26;--tex:none;--texSize:auto;--texPos:0 0;--washi:none;--tabfont:var(--bfont)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background-color:#c9a87c;color:var(--ink);font-family:var(--bfont);font-size:var(--fs);-webkit-text-size-adjust:100%;line-height:1.35}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,.hf{font-family:var(--hfont);font-weight:700;margin:0}
.muted{color:var(--muted)}
.small{font-size:.82em}
.hidden{display:none!important}
.i{width:1.1em;height:1.1em;vertical-align:-.18em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block}
.timebox{border:1px solid var(--line);background:var(--paper2);border-radius:8px;padding:7px 10px;min-width:96px;text-align:left;font-weight:700}
.timebox.empty{color:var(--muted);font-weight:600}
#tpWrap{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center}
#tpWrap.open{display:flex}
#tp{background:var(--paper);border-radius:14px;padding:16px;width:320px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.tpcols{display:flex;gap:10px;margin:10px 0}
.tpcol{flex:1;height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--paper2);overscroll-behavior:contain;scroll-snap-type:y proximity}
.tpcol button{display:block;width:100%;border:0;background:transparent;padding:9px 0;font-size:1.15em;font-weight:700;scroll-snap-align:center}
.tpcol button.on{background:var(--accent);color:var(--accentInk)}
.tpbig{font-size:2em;font-weight:800;text-align:center;font-family:var(--hfont)}
.clsrow{border:1px solid var(--line);border-radius:10px;padding:8px;margin:6px 0;background:var(--paper2)}
.clsrow .sw{width:26px;height:26px;border-radius:50%;border:2px solid transparent;padding:0}
.clsrow .sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper) inset}
.cell.special{background:var(--paper2);border-style:dashed}
.cell.special .ch{color:var(--muted)}

/* ---------- TOP BAR ---------- */
.ic .i{width:1em;height:1em}
#top{position:sticky;top:0;z-index:30;height:var(--topH);display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--top);color:var(--topInk);border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.08)}
#top #search{background:var(--paper);color:var(--ink)}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--hfont);font-size:1.55em;font-weight:700;white-space:nowrap}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--accent);color:var(--accentInk);display:grid;place-items:center;font-size:.62em}
#tabs{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs .tab:first-child{margin-left:auto}#tabs .tab:last-child{margin-right:auto}
.tab .sm{display:none}
.tab{border:0;background:transparent;padding:9px 14px;border-radius:999px;font-weight:700;color:var(--topInk);opacity:.75;white-space:nowrap;font-family:var(--tabfont)}
.tab.on{background:var(--accent);color:var(--accentInk);opacity:1}
/* Tab styles */
#tabs{align-self:stretch;align-items:center}
#tabs[data-style=index],#tabs[data-style=folder]{align-items:flex-end}
#tabs[data-style=index] .tab,#tabs[data-style=folder] .tab{border-radius:10px 10px 0 0;background:var(--tabc);color:var(--tabink,#2b2b2b);opacity:.92;padding:9px 14px 8px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.06)}
#tabs[data-style=index] .tab.on,#tabs[data-style=folder] .tab.on{opacity:1;padding-bottom:12px;box-shadow:0 -2px 6px rgba(0,0,0,.12);color:var(--tabink,#1b1b1b)}
#tabs[data-style=folder] .tab{--tabc:#e7d29f;border:1px solid #c9b27a;border-bottom:0}
#tabs[data-style=folder] .tab.on{--tabc:#f6e8c4;--tabink:#1b1b1b!important}
#tabs[data-style=sticky] .tab{background:var(--tabc);color:var(--tabink,#333);border-radius:3px;opacity:.9;transform:rotate(-1.5deg);box-shadow:1px 2px 4px rgba(0,0,0,.15)}
#tabs[data-style=sticky] .tab:nth-child(even){transform:rotate(1.3deg)}
#tabs[data-style=sticky] .tab.on{opacity:1;transform:rotate(0) scale(1.07);box-shadow:2px 4px 8px rgba(0,0,0,.2)}
#tabs[data-style=leaf] .tab{background:var(--tabc);color:var(--tabink,#2f3a2a);border-radius:18px 3px 18px 3px;opacity:.92}
#tabs[data-style=leaf] .tab.on{opacity:1;background:var(--accent);color:var(--accentInk)}
#tabs[data-style=chalk] .tab{background:transparent;border:2px dashed currentColor;border-radius:8px;font-size:1.08em}
#tabs[data-style=chalk] .tab.on{border-style:solid;background:rgba(255,255,255,.14);color:var(--topInk)}
#tabs[data-style=simple] .tab{background:transparent;border-radius:0;border-bottom:3px solid transparent;color:var(--topInk)}
#tabs[data-style=simple] .tab.on{border-bottom-color:var(--accent);background:transparent;color:var(--topInk)}
.topright{display:flex;align-items:center;gap:8px}
#search{width:160px;border:1px solid var(--line);background:var(--paper2);border-radius:999px;padding:7px 12px}
#sync{font-size:.75em;color:var(--muted);white-space:nowrap}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 11px;font-weight:700}
.iconbtn.on{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}

#banner:empty{display:none}
#banner{display:flex;flex-direction:column;gap:6px;padding:8px 14px 0}
.bn{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:var(--radius);padding:9px 12px}
.bn .grow{flex:1}

/* ---------- LAYOUT ---------- */
#body{display:flex;min-height:calc(100vh - var(--topH))}
#main{flex:1;min-width:0;padding:12px 14px 40px}
#panel{width:250px;flex:none;border-left:1px solid var(--line);background:var(--paper);padding:12px 10px 40px;position:sticky;top:var(--topH);height:calc(100vh - var(--topH));overflow-y:auto}
#panel.closed{display:none}
.panel-year{font-family:var(--hfont);font-size:1.5em;margin:6px 4px 4px}
.panel-term{font-weight:800;font-size:.85em;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 6px 4px}
.wkbtn{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:6px 8px;border-radius:8px;text-align:left}
.wkbtn:hover{background:var(--paper2)}
.wkbtn.sel{background:var(--accent);color:var(--accentInk)}
.wkbtn.today:not(.sel){outline:2px dashed var(--accent);outline-offset:-2px}
.wkbtn .n{font-weight:800;min-width:30px}
.wkbtn .d{flex:1;font-size:.88em}
.ab{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:6px;font-weight:800;font-size:.75em;padding:0 5px;background:var(--paper2);color:var(--ink);border:1px solid var(--line)}
.ab.B{background:var(--ink);color:var(--paper)}
.holrow{margin:8px 8px;padding:6px 8px;border-radius:8px;background:var(--paper2);font-size:.82em;color:var(--muted);text-align:center}

/* ---------- PLANNER ---------- */
.wkhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.wkhead h1{font-size:2.1em;line-height:1}
.wkhead .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:7px 12px;font-weight:700}
.seg button.on{background:var(--accent);color:var(--accentInk)}
.abbig{font-size:1em;padding:4px 10px;border-radius:8px;font-weight:800;background:var(--accent);color:var(--accentInk)}
.grid{display:grid;gap:6px;background:transparent}
.gh{text-align:left;font:inherit;cursor:pointer;background:var(--dayhead,var(--accent));background-image:var(--dayheadImg,none);background-size:12px 12px;text-shadow:var(--dayheadShadow,none);color:var(--dayheadInk,var(--accentInk));border-radius:var(--radius);padding:8px 10px;position:relative;overflow:hidden;border:1px solid var(--line)}
.gh::before{content:"";position:absolute;left:18%;right:18%;top:0;height:10px;background:var(--washi);opacity:0;transform:rotate(-1deg)}
.x-washi .gh::before{opacity:.95}
.x-today .gh.today::after{content:"Today!";position:absolute;right:8px;top:10px;background:#fff27a;color:#3a3a2a;font-family:var(--hfont);font-weight:700;padding:3px 9px;transform:rotate(5deg);box-shadow:1px 2px 4px rgba(0,0,0,.18)}
[data-theme=vintage] .gh .dn{color:var(--accent);border:2px solid var(--accent);display:inline-block;padding:0 7px;border-radius:4px;transform:rotate(-2deg);font-size:1.15em;margin:2px 0}
/* The planner "page" sits on the desk */
.page{position:relative;background-color:var(--paper);background-image:var(--tex);background-size:var(--texSize);background-position:var(--texPos);border-radius:16px;padding:16px 16px 22px;box-shadow:0 6px 24px rgba(0,0,0,.14);min-height:calc(100vh - var(--topH) - 40px)}
.x-spiral .page{padding-top:30px}
.x-spiral .page::before{content:"";position:absolute;left:20px;right:20px;top:8px;height:14px;background:radial-gradient(circle at 7px 7px, var(--paper) 0 4px, rgba(0,0,0,.35) 4.5px 5.5px, transparent 6px) 0 0/26px 14px repeat-x;opacity:.9}
.decor{position:absolute;pointer-events:none;color:var(--accent);opacity:.22;z-index:0}
.pagebody{position:relative;z-index:1}
.decor .i{width:100%;height:100%;stroke-width:1.4}
.coffee{position:absolute;right:30px;top:40px;width:110px;height:110px;border-radius:50%;pointer-events:none;background:radial-gradient(circle, transparent 44px, rgba(120,80,40,.16) 45px, rgba(120,80,40,.09) 50px, transparent 53px)}
.clipdeco{display:inline-block;width:30px;height:46px;color:#8e98a6;transform:rotate(-12deg);margin-right:-6px;margin-top:-18px}
.clipdeco .i{width:100%;height:100%;stroke-width:1.6}
.confetti-bit{position:fixed;top:-12px;width:9px;height:14px;z-index:120;pointer-events:none;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
.pv-tex{height:44px;border-radius:8px;border:1px solid var(--line)}
.gh .dn{font-family:var(--hfont);font-size:1.5em;line-height:1.05}
.gh.today{border:2px solid var(--ink)}
.gh .ev{display:inline-block;margin-top:3px;font-size:.72em;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--paper);color:var(--accent)}
.gh .muted{color:inherit;opacity:.85}
.gh.today{box-shadow:0 0 0 3px var(--ink) inset}
.verse{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:var(--radius);padding:10px 14px;margin-bottom:10px}
.verse .vt{font-family:var(--hfont);font-size:1.25em;line-height:1.3}
.funchip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-weight:800;font-size:.85em}
.rl{padding:8px 6px;font-weight:800;font-size:.85em;display:flex;flex-direction:column;justify-content:center}
.rl .t{font-weight:600;font-size:.82em;color:var(--muted)}
.rl.brk{font-size:.75em;padding:3px 6px}
.cell{border:1px solid var(--line);background-color:var(--paper);box-shadow:0 1px 2px rgba(0,0,0,.08);background-image:none;border-radius:var(--radius);padding:0;text-align:left;min-height:92px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.cell.brk{min-height:30px;background:var(--paper2);background-image:none;justify-content:center;padding:3px 8px;font-size:.8em}
.cell.brk .duty{font-weight:800;color:var(--accent)}
.cell.free{background:var(--paper)}
.cell.free .fl{padding:8px;color:var(--muted);font-size:.85em}
.cell.off{background:repeating-linear-gradient(135deg,var(--paper2) 0 10px,var(--paper) 10px 20px);border-style:dashed;min-height:30px}
.cell.hasas{box-shadow:0 0 0 3px #c62828;border-color:#c62828}
.asbanwrap{display:flex;flex-direction:column;gap:2px}
.asban{display:flex;align-items:center;gap:5px;background:#c62828;color:#fff;font-weight:800;font-size:.78em;letter-spacing:.02em;padding:3px 8px;border-radius:6px;cursor:pointer;text-align:left;line-height:1.2}
.asbanwrap .asban{border-radius:0}
.asban svg{width:14px;height:14px;flex:none}
.asban .ascls{font-weight:600;opacity:.9}
.asban .asx{margin-left:auto;padding:0 2px;border-radius:4px;display:inline-flex}.asban .asx:hover{background:rgba(255,255,255,.25)}.asban .asx svg{width:12px;height:12px}
.btn.asbtn{background:#c62828;color:#fff;border-color:#c62828;font-weight:800}
.asnote{display:flex;gap:6px;align-items:flex-start;background:#fdecea;color:#8e1b1b;border:2px solid #c62828;border-radius:8px;padding:6px 10px;margin-top:6px;font-size:.9em}
.asline{color:#c62828;font-weight:800;background:#fdecea;display:inline-block;padding:2px 4px;border-radius:4px}
.cell.solid .tp.none{color:inherit;opacity:.6}
.cell.dkcell .tp,.cell.dkcell .ln,.cell.dkcell .ln span,.cell.dkcell .ic{color:#fff!important}
#gdGate{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:var(--page);padding:20px}
.gdcard{max-width:440px;text-align:center;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
#gdBanner{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9000;display:flex;gap:10px;align-items:center;background:#fff3cd;color:#5c4400;border:2px solid #e0b100;border-radius:12px;padding:8px 12px;box-shadow:0 6px 18px rgba(0,0,0,.2);font-size:.9em;max-width:94vw}
.pampas{position:absolute;pointer-events:none;z-index:0}
.gh:has(.mascot){padding-right:52px}
.gh .mascot{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;cursor:pointer;z-index:2;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.gh .mascot svg{width:100%;height:100%;overflow:visible}
.gh .mascot .m-sway{transform-origin:25px 27px;animation:msway 4s ease-in-out infinite}
.gh .mascot.hop{animation:mhop .7s ease}
.gh .mascot.hop .m-leaf{animation:mleaf .9s ease}
.gh .mascot.hop .m-spark{animation:mspark .8s ease}
@keyframes mspark{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.4)}}
.gh .mascot .m-spark{transform-origin:24px 24px}
.gh .mascot.hop .m-curl{stroke-dasharray:60;animation:mcurl 1.2s ease}
@keyframes mcurl{0%{stroke-dashoffset:0}40%{stroke-dashoffset:22}100%{stroke-dashoffset:0}}
@keyframes msway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes mhop{0%,100%{transform:translateY(-50%)}30%{transform:translateY(-80%) rotate(-8deg)}60%{transform:translateY(-45%) rotate(6deg)}}
@keyframes mleaf{0%{transform:scaleY(.2);transform-origin:25px 22px}100%{transform:scaleY(1);transform-origin:25px 22px}}
@media (prefers-reduced-motion: reduce){.gh .mascot .m-sway,.gh .mascot.hop{animation:none}}
.cell.now{box-shadow:0 0 0 3px var(--accent)}
.cell .ch{display:flex;align-items:center;gap:6px;padding:4px 8px;font-weight:800;font-size:.85em}
.cell .ch .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room{font-size:.78em;font-weight:800;padding:1px 6px;border-radius:6px;background:rgba(255,255,255,.75);color:#222}
.cell .cb{padding:5px 8px 7px;display:flex;flex-direction:column;gap:2px;font-size:.84em}
.cell .tp{color:var(--c-topic);font-weight:700;font-size:1.04em}
.cell .tp.none{opacity:.5;font-weight:600;font-style:italic}
.ln{display:flex;gap:5px;align-items:flex-start}
.ln .ic{flex:none;width:1.1em;text-align:center}
.ln.res{color:var(--c-res)} .ln.chk{color:var(--c-check)} .ln.set{color:var(--c-set)}
.ln.done{text-decoration:line-through;opacity:.55}
.cell.cancel{background:repeating-linear-gradient(135deg,var(--paper) 0 9px,var(--paper2) 9px 18px)}
.cell.cancel .cb{opacity:.6}
.badge{font-size:.72em;font-weight:800;padding:1px 6px;border-radius:999px;background:var(--ink);color:var(--paper)}
.hwfoot{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;font-size:.8em;min-height:40px}
.hwfoot .ln{align-items:center}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.weeknotes{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.daytabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.holiday-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:30px;text-align:center}
.holiday-card .big{font-size:3em}

/* ---------- CARDS / FORMS ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.card h2{font-size:1.6em;margin-bottom:6px}
.card h3{font-size:1.3em;margin:6px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{border:1px solid var(--line);background:var(--paper2);border-radius:8px;padding:7px 9px;min-width:0}
textarea{width:100%;resize:vertical;min-height:70px}
.btn{border:1px solid var(--line);background:var(--paper2);border-radius:999px;padding:7px 14px;font-weight:700}
.btn.pri{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.btn.danger{color:#b3261e;border-color:#e5b8b4}
.btn.sm{padding:4px 10px;font-size:.85em}
.x{border:0;background:transparent;font-size:1.1em;color:var(--muted);padding:2px 6px}
label.chk{display:inline-flex;gap:6px;align-items:center}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:21px;height:21px;margin:0;flex:none;border:2px solid var(--cbBorder,#b9b0a3);border-radius:6px;background:var(--cbBg,#fff);display:inline-grid;place-items:center;cursor:pointer;vertical-align:middle}
input[type=checkbox]:checked{border-color:var(--accent)}
input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--cbTick,#2d2a26);border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.codebox{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 3px 4px;border:1px solid var(--line);border-radius:999px;background:var(--paper);margin:3px 4px 3px 0;font-weight:700;font-size:.88em}
.codebox.done{opacity:.55;text-decoration:line-through}
.codebox{cursor:pointer;color:inherit;font-family:inherit}
.cbx{width:19px;height:19px;border:2px solid var(--cbBorder,#b9b0a3);border-radius:5px;background:var(--cbBg,#fff);display:inline-grid;place-items:center;flex:none}
.cbx.on{border-color:var(--accent)}
.cbx.on::after{content:"";width:5px;height:10px;border:solid var(--cbTick,#2d2a26);border-width:0 3px 3px 0;transform:translateY(-1px) rotate(45deg)}
.carry-opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper2);border-radius:10px;padding:9px 12px;margin:5px 0;font-weight:700}
.carry-opt:disabled{opacity:.45;cursor:default}
.dblbadge{font-size:.68em;font-weight:800;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.8);color:#333}
.skillchip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;font-weight:700;margin:3px}
.skillchip.rev{background:#fde2dc;border-color:#d9705c;color:#7a2b1c}
[data-mode=dark] .skillchip.rev{background:#5a2c26;color:#ffd7cf}
.hint{font-size:.8em;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--paper2);border-radius:999px;padding:5px 11px;font-weight:700;font-size:.88em}
#clsChips .chip{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.chip.on{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
.swatch{width:30px;height:30px;border-radius:8px;border:2px solid rgba(0,0,0,.12);padding:0}
input[type=color]{width:38px;height:32px;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--paper2)}

/* ---------- SHEET (lesson editor) ---------- */
#sheetWrap{position:fixed;inset:var(--topH) 0 0 0;z-index:50;background:rgba(0,0,0,.25);display:none}
#sheetWrap.open{display:block}
#sheet{position:absolute;right:0;top:0;bottom:0;width:min(560px,100%);background:var(--paper);overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.18);padding-bottom:60px}
.sh-head{position:sticky;top:0;z-index:2;padding:12px 16px;display:flex;align-items:flex-start;gap:10px}
.sh-head h2{font-size:1.9em;line-height:1}
.sh-sec{padding:10px 16px;border-top:1px solid var(--line)}
.sh-sec h3{font-size:1.35em;margin-bottom:6px}
.item{display:flex;gap:8px;align-items:center;padding:3px 0}
.item input[type=text]{flex:1}
.item.done input[type=text]{text-decoration:line-through;opacity:.6}
.tsel{border-radius:999px;padding:5px 6px;font-size:.82em;font-weight:700}
.qa{display:flex;gap:6px;flex-wrap:wrap;padding:8px 16px 12px}
.icons{display:flex;gap:4px;flex-wrap:wrap}
.icons button{border:1px solid var(--line);background:var(--paper2);border-radius:8px;font-size:1.15em;padding:3px 7px;opacity:.45}
.icons button.on{opacity:1;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}

/* ---------- MODAL ---------- */
#modalWrap{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px}
#modalWrap.open{display:flex}
#modal{background:var(--paper);border-radius:14px;max-width:720px;width:100%;max-height:92vh;overflow-y:auto;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
#modalWrap.full #modal{max-width:1100px;height:92vh}
pre.out{white-space:pre-wrap;background:var(--paper2);border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--bfont);font-size:.92em;margin:8px 0;max-height:50vh;overflow:auto}

/* ---------- INK ---------- */
.ink{border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden}
.inkbar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;padding:5px 6px;background:var(--paper2);border-bottom:1px solid var(--line)}
.inkbar .pc{width:24px;height:24px;border-radius:50%;border:2px solid transparent;padding:0}
.inkbar .pc.on{border-color:var(--ink)}
.inkbar .tb{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:2px 8px;font-size:.82em;font-weight:700}
.inkbar .tb.on{background:var(--accent);color:var(--accentInk)}
.ink canvas{display:block;width:100%;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background-image:var(--tex);background-size:var(--texSize);background-position:var(--texPos);background-color:var(--paper)}

/* ---------- PRINT/EMAIL/TOPICS ---------- */
.list-item{display:flex;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px dashed var(--line)}
.list-item.done .tx{text-decoration:line-through;opacity:.55}
.typeTag{font-size:.72em;font-weight:800;padding:2px 7px;border-radius:999px;color:#fff}
.t-print{background:#5b6ee1}.t-bring{background:#d08a2e}.t-upload{background:#2f9e8f}.t-todo{background:#8a6fb0}
.subh{font-family:var(--hfont);font-size:1.35em;color:var(--muted);margin-top:2px}
.progress{height:8px;background:var(--paper2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress div{height:100%;background:var(--accent)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.termgrp{margin-bottom:6px}
.tl{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.78em;font-weight:800;margin:1px 3px 1px 0}
.tl.ok,.tdot.ok{background:#cdebc9;color:#25632a}.tl.late,.tdot.late{background:#fde3a7;color:#7a5410}.tl.miss,.tdot.miss{background:#f6c3bb;color:#8a2a1b}.tl.due,.tdot.due{background:#e4e4e4;color:#666}
.tally{border-collapse:collapse;min-width:100%}.tally th,.tally td{border:1px solid var(--line);padding:6px;text-align:center;font-size:.88em}.tally thead th{background:var(--paper2);max-width:120px}.tally tbody th{text-align:left;background:var(--paper2)}
.tdot{display:inline-block;width:22px;height:22px;border-radius:6px}
.termhead{display:flex;align-items:center;gap:8px;width:100%;border:0;background:var(--paper2);border-radius:8px;padding:8px 10px;font-weight:800;text-align:left;margin:4px 0}
.seq-row{display:flex;align-items:center;gap:8px;padding:6px 6px;border-radius:8px;background:var(--paper);border:1px solid var(--line);margin-bottom:5px}
.seq-row.wklight{background:color-mix(in srgb,var(--paper) 96%,var(--ink))}
.seq-row.wkdark{background:color-mix(in srgb,var(--paper) 86%,var(--ink))}
.seq-row.drag{opacity:.6;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.handle{cursor:grab;touch-action:none;padding:4px 6px;color:var(--muted);font-size:1.1em;user-select:none;-webkit-user-select:none}
.seq-row .num{font-weight:800;min-width:26px;color:var(--muted)}
.seq-row .when{font-size:.78em;color:var(--muted);min-width:110px;text-align:right}
.settings{display:grid;grid-template-columns:210px 1fr;gap:14px}
.snav{display:flex;flex-direction:column;gap:3px}
.snav button{border:0;background:transparent;text-align:left;padding:8px 12px;border-radius:8px;font-weight:700}
.snav button.on{background:var(--accent);color:var(--accentInk)}
.ttgrid{border-collapse:collapse;width:100%;min-width:760px}
.ttgrid th,.ttgrid td{border:1px solid var(--line);padding:7px;vertical-align:top}
.ttgrid thead th{background:var(--accent);color:var(--accentInk);font-size:.92em;text-align:center;font-weight:800}
.ttgrid tbody th{background:var(--paper2);text-align:left;white-space:nowrap;font-size:.92em;width:120px;font-weight:800}
.ttgrid tbody tr:nth-child(odd) td{background:var(--paper)}
.ttgrid tbody tr:nth-child(even) td{background:var(--paper2)}
.ttgrid tbody tr:nth-child(even) th{background:var(--line)}
.ttgrid select,.ttgrid input{width:100%;font-size:.88em;padding:6px}
.ttgrid .rowtime{display:block;font-weight:600;color:var(--muted);font-size:.8em}
.ttgrid td.ttoff{color:var(--muted);font-size:.8em;font-style:italic;text-align:center;vertical-align:middle}
.ttable{border-collapse:separate;border-spacing:4px;width:100%}
.ttable th{font-size:.8em;text-align:left;color:var(--muted)}
.ttable td{vertical-align:top}
.ttable select,.ttable input{width:100%;font-size:.85em;padding:5px}
.themecards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tcard{border:2px solid var(--line);border-radius:12px;padding:0;overflow:hidden;text-align:left;background:var(--paper)}
.tcard.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tcard .pv{height:60px;display:flex;gap:4px;padding:8px}
.tcard .pv span{flex:1;border-radius:5px}
.tcard .nm{padding:6px 8px;font-weight:800;font-size:.88em}
.fontpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.fontpick button{border:1px solid var(--line);background:var(--paper2);border-radius:8px;padding:8px;text-align:left}
.fontpick button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.fontpick .fs{font-size:1.25em;display:block}
.wiz-steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.wiz-steps span{font-size:.8em;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--paper2);color:var(--muted)}
.wiz-steps span.on{background:var(--accent);color:var(--accentInk)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;opacity:0;transition:.25s;z-index:80;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.pop{animation:pop .25s ease}
.loading{display:grid;place-items:center;height:70vh;text-align:center}

@media (max-width:1350px){ .brand span.bt{display:none} #search{width:120px} }
@media (max-width:1100px){ .tab .lg{display:none} .tab .sm{display:inline} #sync{display:none} .tab{padding:8px 11px} }
@media (max-width:1000px){
  #panel{position:fixed;right:0;top:var(--topH);z-index:40;box-shadow:-8px 0 24px rgba(0,0,0,.15)}
  #search{width:110px}
  .brand span.bt{display:none}
}
@media (max-width:760px){
  .settings{grid-template-columns:1fr}
  .snav{flex-direction:row;overflow-x:auto}
  #sync{display:none}
  .tab{padding:8px 10px;font-size:.9em}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><span class="logo" id="logo"></span><span class="bt" id="brandName">My Planner</span></div>
    <nav id="tabs"></nav>
    <div class="topright">
      <input id="search" type="search" placeholder="Search…" autocomplete="off">
      <span id="sync"></span>
      <button class="iconbtn hidden" id="undoBtn" data-act="undo" title="Undo the last change"><span id="undoIcon"></span> Undo</button>
      <button class="iconbtn hidden" id="revertBtn" data-act="revert" title="Undo everything from this working session"><span id="revertIcon"></span> Revert</button>
      <button class="iconbtn hidden" id="redoBtn" data-act="redo" title="Redo what you just undid"><span id="redoIcon"></span> Redo</button>
      <button class="iconbtn" id="panelBtn" data-act="toggle-panel" title="Choose week"><span id="wkIcon"></span> Weeks</button>
    </div>
  </header>
  <div id="banner"></div>
  <div id="body">
    <main id="main"><div class="loading"><div><div class="hf" style="font-size:2.4em">Opening your planner…</div><p class="muted">Connecting to your saved planning.</p></div></div></main>
    <aside id="panel"></aside>
  </div>
</div>
<div id="sheetWrap"><div id="sheet"></div></div>
<div id="modalWrap"><div id="modal"></div></div>
<div id="tpWrap"><div id="tp"></div></div>
<div id="toast"></div>

function renderPanel() {
  const tw = termWeeks(), terms = sortedTerms(), sel = selWeek(), tm = mondayOf(todayIso());
  if (!terms.length) return `<p class="muted small">Add your term dates in Settings → Terms & rotation.</p>`;
  let out = '', lastYear = '';
  terms.forEach((t, i) => {
    const y = t.start.slice(0, 4);
    if (y !== lastYear) { out += `<div class="panel-year">${y}</div>`; lastYear = y; }
    out += `<div class="panel-term">${esc(t.name.replace(/\s*\d{4}$/, ''))}</div>`;
    Object.keys(tw).filter(m => tw[m].term === t).sort().forEach(m => {
      const wi = tw[m];
      out += `<button class="wkbtn ${m === sel ? 'sel' : ''} ${m === tm ? 'today' : ''}" data-act="week" data-v="${m}"><span class="n">W${wi.n}</span><span class="d">${fmtDM(m < t.start ? t.start : m)}</span><span class="ab ${wi.letter}">${wi.letter}</span></button>`;
    });
    const nx = terms[i + 1];
    if (nx) {
      const gapStart = addDays(mondayOf(t.end), 7), gapEnd = mondayOf(nx.start);
      const wks = Math.max(0, daysBetween(gapStart, gapEnd) / 7);
      if (wks > 0) out += `<button class="holrow" style="border:0;width:calc(100% - 16px)" data-act="week" data-v="${gapStart}">${I('sun')} Holidays · ${wks} week${wks > 1 ? 's' : ''}</button>`;
    }
  });

}

      const s = keyRow(key) === 'day' ? null : slotsOn(d).find(x => x.key === key);
      if (!s && keyRow(key) !== 'day') continue;
      items.forEach(r => {
        const it = s ? { kind: 'les', key, d, s, r } : { kind: 'day', key, d, r };
        if (d >= m) (groups[d] = groups[d] || []).push(it); else if (!r.done) carried.push(it);

    } else if (k.startsWith('W_')) {
      const wk = k.slice(2), w = S.docs[k];
      (w.extras || []).filter(x => x.text && want(x.type)).forEach(x => {
        const it = { kind: 'ext', wk, d: wk, r: x };

    const d = keyDate(key); if (d > end || L(key).cancelled) continue;

    bl.forEach((b, i) => { const r = { id: 'tb_' + tbKey(t.id, i), text: b, type: 'bring', done: !!(L(key).tbDone || {})[tbKey(t.id, i)] }, it = { kind: 'les', key, d, s, r };

  if (S.ui.topicCls === '__duties') return head + classChips() + renderDuties();
  if (!cls(S.ui.topicCls)) S.ui.topicCls = classes[0].id;
  const cid = S.ui.topicCls, c = cls(cid), sd = seqDoc(cid), a = assign(), terms = sortedTerms();
  const tv = S.ui.topicView || 'list', topicsAll = sd.topics || [], lw = linkedWith(cid);
  let ti = S.ui.topicTerm;
  if (ti == null || !terms[ti]) { const wi = weekInfo(S.ui.week); ti = wi ? terms.indexOf(wi.term) : terms.findIndex(t => t.end >= todayIso()); if (ti < 0) ti = 0; S.ui.topicTerm = ti; }
  const term = terms[ti] || null;
  const lessons = terms.length ? (a.all[cid] || []).filter(k => keyDate(k) >= terms[0].start) : [];
  const fromToday = lessons.filter(k => keyDate(k) >= todayIso());
  const defStart = fromToday[0] || lessons[0] || '';
  const afterLast = (() => { const sq = a.seq[cid] || [], last = sq[sq.length - 1]; return last ? lessons.find(k => keyCmp(k, last) > 0 && !a.map[k]) : null; })();
  const seqStart = S.ui.seqStart && lessons.includes(S.ui.seqStart) ? S.ui.seqStart : (afterLast && keyDate(afterLast) >= todayIso() ? afterLast : defStart);
  const addAt = S.ui.addAt && lessons.includes(S.ui.addAt) ? S.ui.addAt : (S.ui.addAt = defStart);
  const pinLesson = S.ui.pinLesson && lessons.includes(S.ui.pinLesson) ? S.ui.pinLesson : defStart;
  S.ui.seqDraft = S.ui.seqDraft || {};

  const lessonOpts = sel => lessons.map(k => `<option value="${k}" ${k === sel ? 'selected' : ''}>${esc(lessonLabel(k))}</option>`).join('') || '<option value="">No lessons in the timetable yet</option>';
  const slots = term ? classSlotsInTerm(cid, term) : [];
  const seqInTerm = slots.filter(s => a.map[s.key]).length;
  const lastShown = slots.map(s => a.map[s.key]).filter(Boolean).pop();
  const remaining = lastShown ? (sd.topics || []).length - lastShown.i - 1 : 0;
  return head + `
  ${classChips()}
  <div class="cols" style="grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)">
  <div>
    <div class="card row" style="padding:10px 14px;margin-bottom:10px"><span class="small" style="font-weight:800">Students in ${esc(c.name)}</span><input type="number" min="0" max="999" inputmode="numeric" style="width:90px" data-chg="clsstudents" data-id="${cid}" value="${c.students || ''}" placeholder="e.g. 24"><span class="hint">Shows on the class buttons above.</span></div>
    ${lw.length ? `<div class="bn" style="margin-bottom:10px">${I('refresh')}<span class="grow small"><strong>Linked with ${esc(lw.map(x => x.name).join(', '))}.</strong> Topics and homework are shared. Change this in Settings → Classes & Colours.</span></div>` : ''}
    <div class="card"><h2>Add Topics</h2>
      <p class="hint">Add topics after your last ${esc(c.name)} topic, or pick a lesson to drop a few into a particular week. Later topics move along to make room. Brackets stay part of the title. Add an assessment with the Assessments card below.</p>
      <div class="row"><span class="small muted">Put it</span><select data-chg="addwhere"><option value="end" ${S.ui.addWhere !== 'at' ? 'selected' : ''}>After my last topic</option><option value="at" ${S.ui.addWhere === 'at' ? 'selected' : ''}>In a particular lesson</option></select>
        ${S.ui.addWhere === 'at' ? `<select class="grow" data-chg="addat">${lessonOpts(addAt)}</select>` : ''}</div>
      ${S.ui.addWhere === 'at' ? '<p class="hint" style="margin-top:2px">After each topic the lesson moves on by one, so you can type several in a row.</p>' : ''}
      <form data-form="topic-add1" style="margin-top:8px"><div class="row nowrap"><input type="text" id="topic-new" class="grow" placeholder="Type a topic and press Enter" enterkeyhint="done" autocomplete="off"><button type="button" class="btn pri" data-act="topic-add1" data-keepfocus>${I('plus')} Add</button></div>
        <div class="row nowrap" style="margin-top:6px"><span style="color:var(--c-res)">${I('bag')}</span><textarea id="topic-bring" class="grow" rows="1" style="min-height:38px" placeholder="Something to bring? (optional – one item per line)"></textarea></div>
        <div class="row nowrap" style="margin-top:6px"><span style="color:var(--c-set)">${I('pencil')}</span><textarea id="topic-hw" class="grow" rows="1" style="min-height:38px" placeholder="Set homework? (optional – one task per line)"></textarea></div>

      <details style="margin-top:10px" ${S.ui.pasteOpen ? 'open' : ''} id="pasteBox"><summary class="small" style="cursor:pointer;font-weight:800">Paste a whole list (a year/semester/term/area of study)</summary>
        <p class="hint" style="margin-top:6px">One topic per line. Choose the lesson the list starts from. Nothing changes until you press a button below. Topics already before that lesson stay where they are.</p>
        <div class="row"><span class="small muted">Start from</span><select class="grow" data-chg="seqstartkey">${lessonOpts(seqStart)}</select></div>
        <textarea id="seq-text" data-ui-in="seqDraft" style="min-height:150px;margin-top:6px" placeholder="Intro to forces&#10;Newton's first law&#10;Revision (Topic test)&#10;…">${esc(S.ui.seqDraft[cid] || '')}</textarea>

      ${(() => { const up = asmts().filter(x => x.cid === cid && x.date >= todayIso()); return up.length ? up.map(x => `<div class="row" style="margin-top:6px">${asmtBanner(x)}<span class="small muted">${esc(asmtWhen(x))}</span></div>`).join('') : `<p class="hint">No upcoming assessments for ${esc(c.name)}. Added ones show in red on the planner and go into the class email 2 weeks and 1 week before.</p>`; })()}</div>
    <div class="card"><h2>Student Codes</h2><p class="hint">${I('lock')} Codes or initials only. These appear as quick picks when you add outstanding homework for ${esc(c.name)}.</p>
      <form class="row nowrap" data-form="code-add"><input type="text" id="code-new" class="grow" placeholder="e.g. 14, 22, JS (separate with commas)" autocomplete="off"><button type="button" class="btn pri" data-act="code-add" data-keepfocus>${I('plus')} Add</button></form>
      <div style="margin-top:8px">${(c.codes || []).map(x => `<span class="chip" style="margin:3px">${esc(x)} <button class="x" data-act="code-del" data-v="${esc(x)}">${I('x')}</button></span>`).join('') || '<p class="muted small">No codes yet.</p>'}</div></div>
    <div class="card"><h2>Copy & Share</h2>
      <div class="row"><button class="btn" data-act="seq-share">${I('copy')} Copy List to Share</button></div>
      <p class="hint" style="margin-top:10px">${I('users')} Copies every ${esc(c.name)} topic in order, with its assessments, set homework and what to bring (no dates), e.g. <em>Cells | Assessment: Topic test | Bring: Microscopes | Homework: Worksheet 2</em>. Another teacher pastes it into “Paste a whole list” in their own planner and everything comes in the same order. You can paste a colleague's list the same way.</p></div>
    <details class="card" id="perFnBox" ${S.ui.perFnOpen ? 'open' : ''}><summary style="cursor:pointer"><h2 style="display:inline">Lessons per Fortnight</h2> <span class="small muted">${c.perFn ? `– about ${c.perFn}` : '– for planning before your timetable is set'}</span></summary><p class="hint">Planning before you know your timetable? Choose roughly how many ${esc(c.name)} lessons you'll have each fortnight. Topics are spread over draft lessons (e.g. “T1 Wk 3A Lesson 2 (draft)”) so you can see how far a term's topics will go. Once ${esc(c.name)} is in your timetable for a term, its real lessons take over automatically and the topics stay in the same order.</p>
      <div class="row"><span class="small muted">About</span><select data-chg="perfn" data-id="${cid}"><option value="0" ${!c.perFn ? 'selected' : ''}>Not set</option>${Array.from({ length: 16 }, (_, i) => i + 1).map(n => `<option value="${n}" ${+c.perFn === n ? 'selected' : ''}>${n}</option>`).join('')}</select><span class="small muted">lessons a fortnight</span></div>
      ${c.perFn ? (() => { const counts = terms.filter(t => !t.ownTT).map(t => { const real = classSlotsInTerm(cid, t).length; return `${esc(t.name.replace(/\s*\d{4}$/, ''))}: ${real ? real + ' lessons (timetable)' : draftSlots(c, t).length + ' draft lessons'}`; }); return `<p class="small muted" style="margin-top:6px">${counts.join(' · ')}</p>`; })() : ''}</details>

// Term groups that open and close in the Classes tab (the current/next term starts open)
function termIsOpen(id) {
  const o = (S.ui.termOpen || {})[id]; if (o != null) return o;
  if (id === '__none') return true;
  const t = sortedTerms().find(x => x.id === id), today = todayIso(); if (!t) return false;
  const ts = sortedTerms(), ci = ts.findIndex(x => x.end >= today), wk = weekInfo(S.ui.week);
  return (ci >= 0 && (ts[ci].id === t.id || (ts[ci + 1] && ts[ci + 1].id === t.id))) || !!(wk && wk.term.id === t.id);
}
function termHead(id, label, count) { const open = termIsOpen(id); return `<button class="termhead" data-act="term-toggle" data-v="${id}"><span style="display:inline-block;transform:rotate(${open ? 0 : -90}deg);transition:.15s">${I('chev')}</span> ${esc(label)} <span class="small muted">${count}</span></button>`; }
const wkShade = k => { if (!k) return ''; const wi = weekInfo(mondayOf(keyDate(k))); return wi ? (wi.n % 2 ? ' wklight' : ' wkdark') : ''; };
function topicOverview(cid, topicsAll, a, terms) {
  const at = a.topicAt[cid] || {}, groups = {};
  topicsAll.forEach((t, i) => { const k = at[t.id], term = k ? termOf(keyDate(k)) : null; const g = term ? term.id : '__none'; (groups[g] = groups[g] || []).push({ t, i, k }); });
  const order = [...terms.map(t => t.id), '__none'].filter(g => groups[g]);
  if (!topicsAll.length) return `<p class="muted">No topics yet. Type one on the left and press Enter.</p>`;
  return `<p class="hint">Drag the dotted handle to change the order – the lesson dates update to match. Type in a topic to change it, or tap + to add one after it. Open two terms to move a topic between them.</p>
  <div id="seqlist">${order.map(g => { const label = g === '__none' ? 'Not scheduled yet' : terms.find(t => t.id === g).name; return `<div class="termgrp">${termHead(g, label, groups[g].filter(x => x.t.t).length + ' topics')}${termIsOpen(g) ? groups[g].map(({ t, i, k }) => `<div class="seq-row${wkShade(k)}" data-id="${t.id}"><span class="handle" data-drag="${t.id}">${I('grip')}</span><span class="num">${i + 1}</span><input type="text" class="grow" data-in="topic" data-raw="1" data-id="${t.id}" placeholder="Type a topic…" value="${esc(t.t)}">${t.a ? `<span class="badge">${I('test')} ${esc(t.a)} <button class="x" data-act="topic-a-del" data-id="${t.id}" title="Remove assessment" style="padding:0 2px">${I('x')}</button></span>` : ''}${bringsOf(t).length ? `<span class="small" style="color:var(--c-res);white-space:nowrap" title="Bring">${I('bag')} ${esc(bringsOf(t).join(', '))}</span>` : ''}<span class="when">${k ? esc(lessonLabel(k)) : 'No lesson yet'}</span><button class="x" data-act="topic-ins" data-id="${t.id}" title="Add a topic after this one">${I('plus')}</button><button class="x" data-act="topic-del" data-id="${t.id}" title="Delete topic">${I('x')}</button></div>`).join('') : ''}</div>`; }).join('')}</div>`;
}
function lessonByLesson(cid, c, a, terms) {
  if (!terms.length) return '<p class="muted">Add your term dates first.</p>';
  return `<p class="hint">Add set homework and something to bring for individual lessons by selecting ${I('plus')}. Drag to reorder lessons.</p>
  <div id="seqlist">${terms.map(term => { let slots = classSlotsInTerm(cid, term); if (!slots.length && !term.ownTT) slots = draftSlots(c, term).map(key => ({ key })); if (!slots.length) return ''; return `<div class="termgrp">${termHead(term.id, term.name, slots.length + ' lessons')}${termIsOpen(term.id) ? slots.map(sl => {
    const l = L(sl.key), m = a.map[sl.key], when = `<span class="when" style="text-align:left;min-width:170px">${esc(lessonLabel(sl.key))}</span>`;
    if (l.cancelled) return `<div class="seq-row${wkShade(sl.key)}" style="opacity:.6"><span class="handle"></span>${when}<span class="grow"><em>${esc(offLabel(l))}</em></span><button class="btn sm" data-act="cancel-lesson" data-v="${sl.key}">Restore</button></div>`;
    if (l.ownTopic) return `<div class="seq-row${wkShade(sl.key)}"><span class="handle">${I('star')}</span>${when}<span class="grow">${esc(l.ownTopic)}</span></div>`;
    if (m && m.shared) return `<div class="seq-row${wkShade(sl.key)}" style="opacity:.75"><span class="handle"></span>${when}<span class="grow small muted">Double lesson – same topic as ${esc(rowOf(keyRow(m.shared)).label)}</span></div>`;
    if (m) { const t = m.t; return `<div class="seq-row${wkShade(sl.key)}" data-id="${t.id}"><span class="handle" data-drag="${t.id}">${I('grip')}</span>${when}<span class="num">${m.i + 1}</span><span class="grow" style="font-weight:700;color:var(--c-topic)">${esc(t.t || '—')}</span>${(l.assessment || t.a) ? `<span class="badge">${I('test')} ${esc(l.assessment || t.a)} <button class="x" data-act="${l.assessment ? 'lesson-a-del' : 'topic-a-del'}" data-id="${t.id}" data-key="${sl.key}" title="Remove assessment" style="padding:0 2px">${I('x')}</button></span>` : ''}${asmtsOn(keyDate(sl.key), keyRow(sl.key)).filter(x => !x.cid || x.cid === cid).map(x => asmtBanner(x, true, true)).join('')}<button class="x" data-act="lbl-add" data-id="${t.id}" title="Add homework or something to bring">${I('plus')}</button></div>
      ${bringsOf(t).length || (t.hw || []).length ? `<div class="row" style="margin:-2px 0 6px 40px;gap:6px">${bringsOf(t).map((b, bi) => `<span class="chip small" style="color:var(--c-res)">${I('bag')} ${esc(b)} <button class="x" data-act="tb-del" data-id="${t.id}" data-v="${bi}" title="Remove bring item">${I('x')}</button></span>`).join('')}${(t.hw || []).map(hh => `<span class="chip small" style="color:var(--c-set)">${I('pencil')} ${esc(hh.text)}${hh.due ? ` <span class="hint">(${hh.due === 'later' ? 'due date to set' : hh.due === 'next' ? 'due next lesson' : 'due ' + fmtD(hh.due.slice(0, 10))})</span>` : ''} <button class="x" data-act="thw-del" data-tid="${t.id}" data-id="${hh.id}" title="Remove homework">${I('x')}</button></span>`).join('')}</div>` : ''}
      ${S.ui.lblAdd === t.id ? `<form class="clsrow" data-form="lbl-save" style="margin:0 0 8px 40px"><span class="seg"><button type="button" class="${(S.ui.lblKind || 'hw') === 'hw' ? 'on' : ''}" data-act="lbl-kind" data-v="hw">${I('pencil')} Homework Set</button><button type="button" class="${S.ui.lblKind === 'bring' ? 'on' : ''}" data-act="lbl-kind" data-v="bring">${I('bag')} Something to Bring</button></span>
        <textarea id="lbl-text" rows="2" style="width:100%;margin-top:6px;min-height:52px" placeholder="${S.ui.lblKind === 'bring' ? 'One item per line, e.g.\nLaptops\nCalculators' : 'One homework task per line, e.g.\nWorksheet 2\nRead pages 10–12'}"></textarea>
        ${(S.ui.lblKind || 'hw') === 'hw' ? dueChooser('lbl', S.ui.lblDue || '', S.ui.lblDueDate || '') : ''}
        <div class="row" style="margin-top:6px"><span class="hint grow">Each line becomes its own item.</span><button type="button" class="btn pri sm" data-act="lbl-save">Add</button></div></form>` : ''}`; }
    return `<div class="seq-row${wkShade(sl.key)}"><span class="handle"></span>${when}<span class="grow muted"><em>No topic – add one in Topic Overview</em></span></div>`;
  }).join('') : ''}</div>`; }).join('')}</div>`;
}

        <h3>Paper Style</h3>

function searchAll(q) {

    fields.forEach(([w, t]) => { if (t && t.toLowerCase().includes(q)) out.push({ key, text: t, where: w, cname: c.name, color: c.color }); });
  }
  for (const key in a.map) { const t = a.map[key].t.t; if (t.toLowerCase().includes(q)) { const c = cls(classOfKey(key)); out.push({ key, text: t, where: 'Topic', cname: c ? c.name : '', color: c ? c.color : '#999' }); } }
  return out.sort((x, y) => x.key < y.key ? -1 : 1);
}

/* ---------- Reminders banner ---------- */
function dismissed(id) { try { return localStorage.getItem('lp_dis_' + id) === todayIso(); } catch (e) { return false; } }

function renderBanner() {
  if (!S.ready || !cfg() || !cfg().setupDone) { $('#banner').innerHTML = ''; return; }
  const t = todayIso(), nm = nowMins(), di = dayInfo(t), out = [];
  if (Store.mode === 'local') out.push(`<div class="bn">${I('save')}<span class="grow">This planner is saving on this device only (no sync). Open it from your claude.ai link while signed in to sync between devices.</span></div>`);
  [].forEach(r => {
    if (!r.on || +r.day !== dow(t)) return;
    if (r.weeks !== 'both' && r.weeks !== di.letter) return;
    const tm = tMins(r.time); if (tm == null || nm < tm || nm > tm + 240) return;
    const id = 'r_' + r.id; if (dismissed(id) || (S.dis && S.dis[id])) return;
    const go = r.type === 'print' ? `<button class="btn sm pri" data-act="rem-go" data-v="print" data-id="${id}">Open print list</button>` : r.type === 'email' ? `<button class="btn sm pri" data-act="rem-go" data-v="email" data-id="${id}">Open emails</button>` : '';
    out.push(`<div class="bn">${I('clock')}<span class="grow"><strong>${esc(r.label)}</strong></span>${go}<button class="btn sm" data-act="dismiss" data-id="${id}">Done</button></div>`);
  });
  if (false) slotsOn(t).forEach(s => {
    if (!s.c || L(s.key).cancelled) return;
    const st = tMins(s.row.start); if (st == null) return;
    const at = st + (+cfg().roll.mins || 0);
    if (nm < at || nm > at + 20) return;
    const id = 'roll_' + s.key; if (dismissed(id) || (S.dis && S.dis[id])) return;
    out.push(`<div class="bn" style="border-left-color:${cls(s.c).color}">${I('roll')}<span class="grow"><strong>Mark the roll</strong> · ${esc(cls(s.c).name)} · ${esc(s.row.label)}${s.r ? ' · ' + esc(s.r) : ''}</span><button class="btn sm pri" data-act="dismiss" data-id="${id}">${I('check')} Done</button></div>`);
  });
  const html = out.join('');
  if ($('#banner').innerHTML !== html) $('#banner').innerHTML = html;
}

document.addEventListener('mousedown', e => { if (e.target.closest && e.target.closest('[data-keepfocus]')) e.preventDefault(); });
// Pressing Enter / Return / Done in an "add" box does the same as tapping its Add button
// Enter in any text box inside an "add" form presses its Add button (works even when the form has several boxes)
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const el = e.target; if (el.tagName !== 'INPUT') return;
  const f = el.closest && el.closest('form[data-form]'); if (!f) return;
  e.preventDefault();
  const btn = f.querySelector(`[data-act="${f.dataset.form}"]`); if (btn) btn.click();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, btn = f.dataset.form && f.querySelector(`[data-act="${f.dataset.form}"]`);
  if (btn) btn.click();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.ui.tp) { S.ui.tp = null; render(); return; }
  if (e.key === 'Escape') { if (S.ui.modal && S.ui.modal.type !== 'wizard') S.ui.modal = null; else S.ui.sheet = null; render(); }
});
$('#search').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.value.trim()) { S.ui.modal = { type: 'search', q: e.target.value }; render(); } });
window.addEventListener('resize', () => { clearTimeout(window._rz); window._rz = setTimeout(() => { S.ver++; render(); }, 200); });

// Drag class buttons to reorder them
document.addEventListener('pointerdown', e => {
  const chip = e.target.closest && e.target.closest('#clsChips [data-chip]'); if (!chip || e.button > 0) return;
  const box = $('#clsChips'), sx = e.clientX, sy = e.clientY; let moving = false;
  const move = ev => {
    if (!moving && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 10) return;
    if (!moving) { moving = true; S.dragging = true; chip.style.opacity = '.6'; }
    ev.preventDefault();
    const over = document.elementFromPoint(ev.clientX, ev.clientY), t = over && over.closest('#clsChips [data-chip]');
    if (t && t !== chip) { const r = t.getBoundingClientRect(); box.insertBefore(chip, ev.clientX < r.left + r.width / 2 ? t : t.nextSibling); }
  };
  const up = () => {
    document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
    if (!moving) return;
    chip.style.opacity = ''; S.dragging = false; S._suppressClick = true; setTimeout(() => { S._suppressClick = false; }, 400);
    const order = $$('[data-chip]', box).map(x => x.dataset.chip);
    beginBatch('reorder'); updCfg(c => { c.tabOrder = order; }); endBatch(); forceRender();
  };
  document.addEventListener('pointermove', move, { passive: false }); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
});
// Drag to reorder topics (works with finger, Apple Pencil, pen and mouse)
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]'); if (!h) return;
  e.preventDefault();
  const row = h.closest('.seq-row'), list = $('#seqlist'); if (!row || !list) return;
  S.dragging = true; row.classList.add('drag'); try { h.setPointerCapture(e.pointerId); } catch (er) { }
  const move = ev => {
    const over = document.elementFromPoint(ev.clientX, ev.clientY); const tgt = over && over.closest('.seq-row');
    if (tgt && tgt !== row && list.contains(tgt) && tgt.dataset.id) { const r = tgt.getBoundingClientRect(); tgt.parentNode.insertBefore(row, ev.clientY < r.top + r.height / 2 ? tgt : tgt.nextSibling); }
  };
  const up = () => {
    document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up);
    row.classList.remove('drag'); S.dragging = false;
    const order = $$('.seq-row[data-id]', list).map(r => r.dataset.id), set = new Set(order);
    beginBatch('reorder'); updSeq(S.ui.topicCls, sd => { const byId = Object.fromEntries(sd.topics.map(t => [t.id, t])); let j = 0; sd.topics = sd.topics.map(t => set.has(t.id) ? byId[order[j++]] : t); }); endBatch();
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    forceRender();
  };
  document.addEventListener('pointermove', move); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
});

// Testing mode (now off): when WIPE_ON_NEW_BUILD is true, each new version starts from a clean slate.
const PLANNER_URL = 'https://claude.ai/artifact/KU9QgvPMBsXD465MuK5tdR';
// Website version only: the Google OAuth client ID (leave empty for the claude.ai version)
const GOOGLE_CLIENT_ID = '744170181576-ngotngduq5a2kh882pfi2dbgid03din1.apps.googleusercontent.com';
const BUILD = '2026-11-22d', WIPE_ON_NEW_BUILD = false;
function wipeAll() { Object.keys(S.docs).forEach(k => { delete S.docs[k]; Store.save(k); }); try { Object.keys(localStorage).filter(k => k.startsWith('lp_dis_')).forEach(k => localStorage.removeItem(k)); } catch (e) { } }
function addHeadstart(c) {
  if (c.hs26 || (c.terms || []).some(t => /headstart/i.test(t.name))) { c.hs26 = true; return false; }
  const valid = (c.terms || []).filter(t => t.start && t.end).sort((a, b) => a.start < b.start ? -1 : 1);
  if (!valid.length || valid[0].start < '2026-12-12') { c.hs26 = true; return false; }
  const first = valid[0]; first.reset = true; if (!first.startWeek) first.startWeek = c.rotationFirst || 'A';
  c.terms.push({ id: nid(), name: 'Headstart 2026', start: '2026-11-23', end: '2026-12-11', reset: true, startWeek: 'A', ownTT: true, tt: { A: {}, B: {} } });
  c.events = c.events || []; c.events.push({ id: nid(), date: '2026-11-30', end: '2026-12-11', label: 'Teacher planning – no classes', type: 'sfd', noClasses: true });
  c.hs26 = true; return true;
}
function boot() {
  if (S.ready) return;
  if (S.docs.cfg && WIPE_ON_NEW_BUILD && S.docs.cfg.build !== BUILD) wipeAll();
  if (!S.docs.cfg) { S.docs.cfg = defaultCfg(); S.docs.cfg.palName = 'Theme'; S.docs.cfg.build = BUILD; Store.save('cfg'); }
  const d = defaultCfg(), c = S.docs.cfg;
  for (const k in d) if (c[k] === undefined) c[k] = d[k];
  // Move planners still on the original sample bell times to the new default times
  if ((c.rows || []).map(r => `${r.id} ${r.start} ${r.end}`).join('|') === OLD_ROW_TIMES) { c.rows = DEFAULT_ROWS(); Store.save('cfg'); }
  if (c.setupDone && todayIso() < '2026-12-12' && addHeadstart(c)) { Store.save('cfg'); S._hsAdded = true; }
  migrateSequences();
  S.ready = true;
  S.ui.week = pickStartWeek();
  S.ui.day = Math.min(dow(todayIso()), 5);
  if (window.innerWidth < 1000) S.ui.panel = false;
  if (!c.setupDone) S.ui.modal = { type: 'wizard', step: 0, full: true };
  applyTheme(); setStatus(Store.status);
  render();
  if (S._hsAdded) setTimeout(() => toast('Added Headstart 2026 (23 Nov) and the planning fortnight'), 800);
}
Store.init();
